[project]
name = "systematic-trading-data-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "arcticdb[arrow]>=6.22,<7",
    "databento>=0.83.0",
    "fastapi>=0.116",
    "httpx>=0.28",
    "pandas>=2.2",
    "polars>=1.30",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installs `src` into the venv, so `import src...` resolves from any directory
# and any invocation. Without this, only `python -m ...` (which puts the cwd on
# sys.path) and pytest (via `pythonpath` below) could find it.
[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
